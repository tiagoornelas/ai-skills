<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdr Observer</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#e3e7ec;--soft:#f0f2f5;
  --ok:#1f8a4c;--ok-bg:#e3f4ea;--warn:#a86400;--warn-bg:#fdf0d9;--bad:#c0362c;--bad-bg:#fbe4e2;
  --info:#2457c5;--info-bg:#e3ebfb;--idle:#6b7280;--idle-bg:#eceef1;--accent:#6d4fd6;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1216;--panel:#171b21;--ink:#e6e9ee;--muted:#98a2b0;--line:#2a3039;--soft:#1e232a;
  --ok:#4cc27e;--ok-bg:#16301f;--warn:#e0a443;--warn-bg:#33270f;--bad:#ef6b61;--bad-bg:#3a1a18;
  --info:#7aa2ff;--info-bg:#18233d;--idle:#9aa3ad;--idle-bg:#242a31;--accent:#a58cff;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1440px;margin:0 auto;padding:20px 24px}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:20px}
.meta{color:var(--muted);font-size:12px}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.list{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.list h2{margin:0;padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item h3{margin:0 0 4px;font-size:14px}
.compact{padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.dots{display:flex;gap:4px;margin-top:6px}.dot{width:12px;height:12px;border-radius:50%}
.d-working{background:var(--info)}.d-idle{background:var(--idle)}.d-blocked{background:var(--bad)}.d-done{background:var(--ok)}.d-unknown{background:var(--line)}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-working{background:var(--info-bg);color:var(--info)}.s-idle,.s-unknown{background:var(--idle-bg);color:var(--idle)}
.s-blocked{background:var(--bad-bg);color:var(--bad)}.s-done{background:var(--ok-bg);color:var(--ok)}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.na{background:var(--idle-bg);color:var(--idle)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px}
.src{font-size:10px;color:var(--muted);margin-left:4px;font-style:italic}
.detail{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 18px}
.detail h2{margin:0 0 2px;font-size:18px}
.org{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.agent{flex:1 1 180px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.agent.lead{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:8px;padding:10px 12px}
.col h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;font-size:13px}
.card a{color:inherit;font-weight:600}
.dec{border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-bg);border-radius:4px;margin-top:6px}
.div{color:var(--warn);font-size:12px;margin-top:4px}
.changes{border:1px dashed var(--line);border-radius:10px;padding:8px 14px;color:var(--muted);font-size:12.5px;margin-top:16px}
details summary{cursor:pointer;padding:8px 14px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script id="panel-data" type="application/json">/*PANEL_DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById("panel-data").textContent);
const STATUS = {working:"working", idle:"idle", blocked:"blocked", done:"done", unknown:"unknown"};
const SOURCE = {observed:"observed", declared:"declared", inferred:"inferred"};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "onclick") el.onclick = v; else if (v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const pill = (cls, text) => h("span", {class: "pill " + cls}, text);
const src = s => s ? h("span", {class: "src", title: "source of this fact"}, SOURCE[s] || s) : null;
const sourced = f => f ? [f.text, src(f.source)] : [];
const status = s => pill("s-" + (STATUS[s] ? s : "unknown"), STATUS[s] || s);
const when = iso => iso ? new Date(iso).toLocaleString(undefined, {dateStyle: "short", timeStyle: "short"}) : "—";
const openPrs = w => (w.prs || []).filter(p => p.state === "open" || p.state === "draft");

function prFlags(p) {
  const merge = p.state === "merged" ? pill("ok", "merged")
    : p.state === "closed" ? pill("na", "closed")
    : p.mergeable === "yes" ? pill("ok", "mergeable")
    : p.mergeable === "conflict" ? pill("bad", "conflict") : pill("na", "merge ?");
  const ci = {pass: pill("ok", "CI ✓"), fail: pill("bad", "CI ✗"), pending: pill("warn", "CI …")}[p.ci] || pill("na", "no CI");
  const ar = pill(p.agent_review && p.agent_review.done ? "ok" : "na", "agent-review " + (p.agent_review && p.agent_review.done ? "✓" : "—"));
  const hr = p.human_review && p.human_review.done
    ? pill("ok", "human-review" + (p.human_review.recommendation ? ": " + p.human_review.recommendation : " ✓"))
    : pill("na", "human-review —");
  return h("div", {class: "flags"}, merge, ci, ar, hr, p.state === "draft" ? pill("na", "draft") : null);
}

function prCard(p, w) {
  const div = (w.divergences || []).filter(d => d.key && d.key.startsWith(`pr:${p.repo}#${p.number}:`));
  return h("div", {class: "card"},
    h("a", {href: p.url, target: "_blank", rel: "noopener"}, `${p.repo} #${p.number}`), " ", p.title,
    p.summary ? h("div", {class: "meta"}, p.summary) : null,
    prFlags(p),
    (p.tasks && p.tasks.length) ? h("div", {class: "meta"}, "task: " + p.tasks.join(", ")) : h("div", {class: "div"}, "no associated task"),
    div.map(d => h("div", {class: "div"}, "⚠ " + d.text)));
}

function listItem(w, selected, onSelect) {
  const agents = w.agents || [];
  const blocked = agents.some(a => a.status === "blocked");
  return h("div", {class: "item" + (selected ? " sel" : ""), onclick: onSelect},
    h("h3", null, w.label),
    h("div", {class: "meta"}, `${agents.length} agents · ${openPrs(w).length} open PRs`),
    h("div", {class: "dots"}, agents.map(a => h("span", {class: "dot d-" + (STATUS[a.status] ? a.status : "unknown"), title: `${a.name}: ${STATUS[a.status] || a.status}`}))),
    h("div", {class: "flags"},
      (w.decisions || []).length ? pill("warn", `${w.decisions.length} decision(s) for you`) : null,
      blocked ? pill("bad", "blocked") : null,
      (w.divergences || []).length ? pill("warn", "divergence") : null,
      w.kind === "inferred" ? pill("na", "inferred") : null));
}

function detail(w) {
  const agents = w.agents || [];
  const prs = w.prs || [];
  const done = prs.filter(p => p.state === "merged");
  const tasksDone = (w.tasks || []).filter(t => t.done);
  return h("div", {class: "detail"},
    h("h2", null, w.label),
    h("div", {class: "meta"}, ...sourced(w.objective)),
    h("div", {class: "flags"},
      w.kind === "team" ? pill("ok", "leader.md " + when(w.leader_md_updated)) : pill("na", "no leader.md · inferred"),
      (w.tasks || []).map(t => h("span", {class: "tag"}, `${t.tool} ${t.key}${t.status ? " · " + t.status : ""}`))),
    (w.decisions || []).length ? h("div", {style: "margin-top:12px"}, h("b", null, "Your decisions"),
      w.decisions.map(d => h("div", {class: "dec"}, ...sourced(d)))) : null,
    (w.divergences || []).length ? h("div", {style: "margin-top:12px"}, h("b", null, "Plan vs. reality"),
      w.divergences.map(d => h("div", {class: "div"}, `⚠ ${d.text} — plan: ${d.declared}; observed: ${d.observed}`))) : null,
    h("div", {class: "org"}, agents.map(a => h("div", {class: "agent" + (a.role === "leader" ? " lead" : "")},
      h("b", null, (a.role === "leader" ? "★ " : "") + a.name), " ", h("span", {class: "tag"}, a.harness || "?"),
      h("div", {class: "meta"}, ...sourced(a.mission)),
      a.branch ? h("div", {class: "meta"}, `${a.repo || ""} · ${a.branch}`) : null,
      h("div", {style: "margin-top:4px"}, status(a.status))))),
    h("div", {class: "cols"},
      h("div", {class: "col"}, h("h4", null, "Done"),
        done.map(p => prCard(p, w)), tasksDone.map(t => h("div", {class: "card"}, `✓ ${t.tool} ${t.key} ${t.title || ""}`)),
        (done.length + tasksDone.length) ? null : h("div", {class: "empty"}, "nothing done yet")),
      h("div", {class: "col"}, h("h4", null, "Now"),
        prs.filter(p => p.state !== "merged" && p.state !== "closed").map(p => prCard(p, w)),
        agents.filter(a => a.status === "working" && a.mission).map(a => h("div", {class: "card"}, `▶ ${a.name}: ${a.mission.text}`))),
      h("div", {class: "col"}, h("h4", null, "Next"),
        (w.next || []).length ? w.next.map(n => h("div", {class: "card"}, "○ ", ...sourced(n))) : h("div", {class: "empty"}, "nothing planned"))),
    (w.changes || []).length ? h("div", {class: "changes"}, h("b", null, `Since ${when(DATA.view.previous)}: `), w.changes.join(" · ")) : null);
}

function storedSelection() { try { return localStorage.getItem("herdr-observer:" + DATA.view.name); } catch (e) { return null; } }
function storeSelection(id) { try { localStorage.setItem("herdr-observer:" + DATA.view.name, id); } catch (e) {} }

function render(selectedId) {
  const all = DATA.workspaces || [];
  const active = all.filter(w => w.kind !== "other" && w.state !== "concluded");
  const others = all.filter(w => w.kind === "other" && w.state !== "concluded");
  const concluded = all.filter(w => w.state === "concluded");
  const selectable = active.concat(concluded);
  const sel = selectable.find(w => w.workspace_id === selectedId) || active[0] || concluded[0];
  const select = id => () => { storeSelection(id); render(id); };
  const f = DATA.view.filter || {};
  const filter = (f.include || []).length ? "only: " + f.include.join(", ")
    : (f.exclude || []).length ? "all except: " + f.exclude.join(", ") : "all workspaces";
  const app = document.getElementById("app");
  app.replaceChildren(
    h("div", {class: "top"}, h("h1", null, "Observer · " + DATA.view.name),
      h("span", {class: "meta"}, `updated ${when(DATA.view.updated)} · previous ${when(DATA.view.previous)} · ${filter}`)),
    h("div", {class: "wrap"},
      h("div", {class: "list"},
        h("h2", null, `Teams (${active.length})`),
        active.map(w => listItem(w, sel && w.workspace_id === sel.workspace_id, select(w.workspace_id))),
        others.length ? [h("h2", null, `Other workspaces (${others.length})`),
          others.map(w => h("div", {class: "compact"}, h("span", null, w.label), h("span", null, (w.agents || []).map(a => status(a.status)))))] : null,
        concluded.length ? h("details", null, h("summary", null, `Concluded (${concluded.length})`),
          concluded.map(w => listItem(w, sel && w.workspace_id === sel.workspace_id, select(w.workspace_id)))) : null),
      sel ? detail(sel) : h("div", {class: "detail empty"}, "No team matches this view.")));
}
render(storedSelection());
</script>
</body>
</html>
